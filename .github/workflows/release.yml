name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish plugin
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Set up TinyGo
        uses: acifani/setup-tinygo@v3
        with:
          tinygo-version: "0.43.0"

      - name: Build WebAssembly plugin
        run: tinygo build -o plugin.wasm -target wasip1 -buildmode=c-shared .

      - name: Package Navidrome plugin
        run: zip -j "liveplaylist-${GITHUB_REF_NAME}.ndp" manifest.json plugin.wasm

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "liveplaylist-${GITHUB_REF_NAME}.ndp" --title "$GITHUB_REF_NAME" --generate-notes
